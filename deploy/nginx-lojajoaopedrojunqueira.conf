server {
    listen 80;
    listen [::]:80;
    server_name lojajoaopedrojunqueira.com.br www.lojajoaopedrojunqueira.com.br;

    root /var/www/html/dist;
    index index.html;

    # Redireciona o link curto de confirmação para a página pública do Lojas (slug jpj)
    location = /confirmacao {
        return 302 https://lojas.e-sigma.app/confirmacao/jpj$is_args$args;
    }

    location ^~ /confirmacao/ {
        return 302 https://lojas.e-sigma.app/confirmacao/jpj$is_args$args;
    }

    # SPA institucional estática
    location / {
        try_files $uri $uri/ /index.html;
    }
}
